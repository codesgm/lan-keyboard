[package]
name = "lan-keyboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = "1"
dirs = "7.0.0"
eframe = "0.37.0"
env_logger = "0.11.11"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
toml = "1.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", features = ["input_capture"] }
evdev = "0.13"
futures-util = "0.3.34"
reis = { version = "0.7", features = ["tokio"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
