[package]
name = "lan-keyboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = "1"
dirs = "7.0.0"
eframe = "0.37.0"
env_logger = "0.11.11"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
